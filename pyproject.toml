[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-semantic-query"
version = "0.3.2"
description = "Semantic data resolution and SQL access layer for CIB and Risk"
requires-python = ">=3.11"
dependencies = [
  "kuzu>=0.11.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "sqlglot>=25.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-cloud-aiplatform>=1.70"
]

[project.scripts]
risk-query = "risk_query.api.routes:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"risk_query.ui" = ["static/*.html", "static/*.css", "static/*.js"]
